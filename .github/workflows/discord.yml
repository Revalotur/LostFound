name: Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          FIRST_LINE=$(echo "$MESSAGE" | head -n 1)
          jq -n \
            --arg title "🚀 New Push di ${{ github.repository }}" \
            --arg url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg msg "$FIRST_LINE" \
            --arg author "${{ github.event.head_commit.author.username }}" \
            --arg committer "${{ github.event.head_commit.committer.name }}" \
            --arg pushed "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg time "${{ github.event.head_commit.timestamp }}" \
            '{embeds:[{title:$title,url:$url,color:5763719,fields:[
              {name:"📝 Pesan Commit",value:$msg,inline:false},
              {name:"👤 Author",value:$author,inline:true},
              {name:"🧑‍💻 Committer",value:$committer,inline:true},
              {name:"📤 Pushed by",value:$pushed,inline:true},
              {name:"🌿 Branch",value:$branch,inline:true}],
              timestamp:$time}]}' | \
            curl -H "Content-Type: application/json" -d @- "$WEBHOOK"
